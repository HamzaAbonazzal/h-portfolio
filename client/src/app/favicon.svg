<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgIcon" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a24" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </radialGradient>

    <linearGradient id="goldIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9E5A0" />
      <stop offset="20%" stop-color="#E8C766" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#B8941F" />
      <stop offset="100%" stop-color="#8B6F14" />
    </linearGradient>

    <linearGradient id="goldTextIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9C7B1D" />
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>

    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="ringIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgIcon)" />

  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="96"
    fill="none"
    stroke="url(#ringIcon)"
    stroke-width="2"
  />

  <circle cx="256" cy="256" r="150" fill="#D4AF37" opacity="0.08" filter="url(#iconGlow)" />

  <g filter="url(#iconShadow)">
    <rect x="135" y="130" width="45" height="252" rx="8" fill="url(#goldIcon)" />
    <rect x="332" y="130" width="45" height="252" rx="8" fill="url(#goldIcon)" />
    <rect x="135" y="240" width="242" height="22" rx="4" fill="url(#goldIcon)" />
  </g>

  <g transform="rotate(-8 256 250)">
    <text
      x="256"
      y="266"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="60"
      font-style="italic"
      font-weight="700"
      fill="url(#goldTextIcon)"
      letter-spacing="-1"
    >Programmer</text>
  </g>

  <path
    d="M 130 285 Q 256 310 380 280"
    stroke="url(#goldIcon)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
    opacity="0.9"
  />

  <g
    transform="translate(256 375)"
    font-family="'Courier New', monospace"
    font-size="34"
    font-weight="700"
    fill="url(#goldTextIcon)"
    text-anchor="middle"
    filter="url(#iconGlow)"
  >
    <text>&lt;/&gt;</text>
  </g>
</svg>