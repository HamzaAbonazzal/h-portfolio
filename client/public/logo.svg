<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9E5A0" />
      <stop offset="15%" stop-color="#E8C766" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B8941F" />
      <stop offset="100%" stop-color="#8B6F14" />
    </linearGradient>

    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9E5A0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6F14" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B8" />
      <stop offset="30%" stop-color="#F5D973" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9C7B1D" />
    </linearGradient>

    <linearGradient id="goldSwoosh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8941F" stop-opacity="0.3" />
      <stop offset="20%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#E8C766" />
      <stop offset="100%" stop-color="#B8941F" stop-opacity="0.4" />
    </linearGradient>

    <filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5A4A0F" flood-opacity="0.5" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#hShadow)">
    <rect x="200" y="100" width="80" height="300" rx="12" fill="url(#goldBar)" />
    <rect x="200" y="100" width="20" height="300" rx="12" fill="url(#goldEdge)" opacity="0.6" />
    <rect x="520" y="100" width="80" height="300" rx="12" fill="url(#goldBar)" />
    <rect x="520" y="100" width="20" height="300" rx="12" fill="url(#goldEdge)" opacity="0.6" />
    <rect x="200" y="235" width="400" height="30" fill="url(#goldBar)" />
  </g>

  <g transform="rotate(-8 400 250)" filter="url(#textShadow)">
    <text
      x="400"
      y="270"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="110"
      font-style="italic"
      font-weight="700"
      fill="url(#goldText)"
      letter-spacing="-2"
    >Programmer</text>
  </g>

  <path
    d="M 180 300 Q 400 340 640 295"
    stroke="url(#goldSwoosh)"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
  />

  <g
    transform="translate(400 380)"
    font-family="'Courier New', monospace"
    font-size="44"
    font-weight="700"
    fill="url(#goldText)"
    text-anchor="middle"
    filter="url(#softGlow)"
  >
    <text>&lt;/&gt;</text>
  </g>
</svg>